services:
  api:
    build: .
    container_name: prepiq_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/code/app   # live-reload: local edits reflect in the container instantly
    depends_on:
      - mysql
      - mongo
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: prepiq_mysql
    environment:
      MYSQL_ROOT_PASSWORD: prepiq_pass
      MYSQL_DATABASE: prepiq
    ports:
      - "3306:3306"   # exposed so you can also connect via a GUI tool (e.g. MySQL Workbench)
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: prepiq_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: prepiq_frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
